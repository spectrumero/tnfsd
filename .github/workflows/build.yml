on: [push]

name: tnfsd Build

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install xa
        shell: powershell
        run: |
          C:\msys64\usr\bin\pacman -S --noconfirm mingw-w64-x86_64-xa65
          Copy-Item "C:\msys64\mingw64\bin\xa.exe" -Destination "C:\Windows\System32\xa.exe"
      - name: Build tnfsd
        shell: cmd
        run: cd /d D:\a\tnfsd\tnfsd\src && make OS=Windows_NT DEBUG=yes USAGELOG=yes
      - uses: actions/upload-artifact@master
        with:
          name: tnfsd_win-x64
          path: bin/tnfsd.exe

  build-ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y xa65
      - name: Test chroot build configuration
        run: python3 tests/test_make_chroot.py
      - name: Build tnfsd
        run: cd /home/runner/work/tnfsd/tnfsd/src && make OS=LINUX DEBUG=yes USAGELOG=yes
      - name: Test queued UDP datagrams
        run: python3 tests/test_udp_burst.py bin/tnfsd
      - name: Test directory handle leak
        run: python3 tests/test_dir_handle_leak.py bin/tnfsd
      - name: Test handle bounds
        run: python3 tests/test_handle_bounds.py bin/tnfsd
      - uses: actions/upload-artifact@master
        with:
          name: tnfsd_linux-x64
          path: bin/tnfsd

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install xa
      - name: Build tnfsd
        run: cd /Users/runner/work/tnfsd/tnfsd/src && make OS=BSD DEBUG=yes USAGELOG=yes
      - uses: actions/upload-artifact@master
        with:
          name: tnfsd_macos-arm64
          path: bin/tnfsd

  build-macos-x64:
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install xa
      - name: Build tnfsd
        run: cd /Users/runner/work/tnfsd/tnfsd/src && make OS=BSD DEBUG=yes USAGELOG=yes
      - uses: actions/upload-artifact@master
        with:
          name: tnfsd_macos-x64
          path: bin/tnfsd
